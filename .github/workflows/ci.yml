name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: kornsour/gh-automation/.github/workflows/ci.yml@656f46da71566a02a641be3dcc26e07339b6e689 # ci.yml pinned 2026-09-06
    with:
      migration-check: false
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/aws
      - name: Validate AWS static profile
        working-directory: infra/aws
        run: |
          tofu init -backend=false -input=false
          tofu validate
