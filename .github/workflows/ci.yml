name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: lurking-walrus/gh-automation/.github/workflows/ci.yml@9755c5a968c76d19c7f54017d4bcd1b314810426 # main 2026-11-26
    with:
      migration-check: false
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: 1.12.5
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/aws
      - name: Validate AWS static profile
        working-directory: infra/aws
        run: |
          tofu init -backend=false -input=false
          tofu validate
